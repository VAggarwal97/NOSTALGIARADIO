<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#080807" />

    <title>Nostalgia Radio — Old roads, local radios, songs that never left</title>
    <meta
      name="description"
      content="A cinematic, zero-login listening page for curated nostalgic stations: travel, regional folk, festivals, workdays and street-corner memories."
    />
    <link rel="canonical" href="https://nostalgia-radio.example/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Nostalgia Radio" />
    <meta
      property="og:description"
      content="Old roads. Local radios. Festival nights. Shops, workdays and songs that never really left."
    />
    <meta property="og:image" content="/og.svg" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <!-- Stage photos load from this host after the app boots; warm the
         connection during HTML parse so the hero doesn't wait for TLS. -->
    <link rel="preconnect" href="https://i.pinimg.com" />

    <!--
      Baseline CSP for the static app. `frame-ancestors` and `Referrer-Policy` /
      `X-Content-Type-Options` / `Permissions-Policy` / HSTS are HTTP-only and are
      delivered via public/_headers (see README). Keep this meta policy in sync
      with public/_headers.

      The embed allowlist is exactly two providers, driven only when a station
      configures one: the YouTube IFrame API (script from youtube.com/s.ytimg.com,
      player iframe, parent-page beacons) and the Spotify iFrame API (script +
      embed iframe from open.spotify.com). Nothing else may frame in.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://www.youtube.com https://s.ytimg.com https://open.spotify.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' https:; connect-src 'self' https://www.youtube.com https://www.google.com https://open.spotify.com; media-src 'self' https:; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com https://open.spotify.com; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
  </head>
  <body style="margin: 0; background: #080807; color: #f5eee1">
    <!-- Boot screen: painted from the first byte, before CSS or JS download,
         so the stage is dark and branded instead of a blank white wait.
         main.tsx removes it the moment React is about to take over. -->
    <div
      id="boot"
      aria-hidden="true"
      style="position: fixed; inset: 0; z-index: 2147483647; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: #080807; color: #a99c8c; font-family: Georgia, 'Times New Roman', serif; font-size: 12px; letter-spacing: 0.34em; text-transform: uppercase;"
    >
      <span>Nostalgia Radio</span>
      <span
        style="display: block; width: 140px; height: 1px; background: linear-gradient(90deg, transparent, #a99c8c, transparent)"
      ></span>
    </div>
    <div id="root"></div>
    <noscript
      style="position: fixed; left: 0; right: 0; bottom: 24px; z-index: 2147483647; text-align: center; font-family: Georgia, 'Times New Roman', serif; font-size: 13px; color: #a99c8c; padding: 0 24px;"
    >
      Nostalgia Radio needs JavaScript to run its player. No account is ever required.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
