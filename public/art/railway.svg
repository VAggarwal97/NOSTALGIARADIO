<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" preserveAspectRatio="xMidYMid slice">
  
  <defs>
    <linearGradient id="sky-rail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A0E0E"/>
      <stop offset="0.4" stop-color="#4B1717"/>
      <stop offset="0.6" stop-color="#A94A38"/>
      <stop offset="1" stop-color="#0B0807"/>
    </linearGradient>
    <radialGradient id="glow-rail" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#D7A451" stop-opacity="0.75"/>
