      <feComponentTransfer><feFuncA type="linear" slope="0.16"/></feComponentTransfer>
    </filter>
    <filter id="soft-rail"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="soft2-rail"><feGaussianBlur stdDeviation="16"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#sky-rail)"/>
  
